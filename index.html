  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(- ox-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  }\n}\n<\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }\n  body { display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 1fr auto; height: 100vh; overflow: hidden; }\n  a { color: var(--color-text); } a:hover { color: var(--color-accent-600); }\n  three-d-stage:not(:defined) { visibility: hidden; }\n  three-d-stage { display: block; width: 100%; height: 100%; min-height: 0; grid-column: 2; grid-row: 1; }\n  .viewport { grid-column: 2; grid-row: 1; position: relative; min-height: 0; }\n  .viewport three-d-stage { position: absolute; inset: 0; }\n  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }\n  .dim { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; padding: 2px 6px; background: var(--color-bg); border: 1px solid var(--color-text); color: var(--color-text); font-variant-numeric: tabular-nums; }\n  .dim-accent { border-color: var(--color-accent); color: var(--color-accent-700); }\n  .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; background: var(--color-text); color: var(--color-bg); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }\n  .toast.show { opacity: 1; }\n  .toggle { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }\n  .brandmark { position: absolute; top: 16px; left: 20px; height: 42px; width: auto; z-index: 2; display: none; }\n  body.clean .brandmark { display: block; }\n  .jobcard { position: absolute; top: 70px; left: 20px; z-index: 2; display: none; }\n  body.clean .jobcard.has { display: block; }\n  .jobname { margin: 0; font-family: var(--font-heading); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }\n  .jobmeta { margin: 4px 0 0; display: flex; gap: var(--space-3); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-700); }\n  .floorlist { display: grid; gap: 6px; }\n  .floorlist .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }\n  .floorlist label { margin: 0; }\n  .floorlist .unit { width: 120px; }\n  aside { grid-row: 1 / span 2; border-right: 2px solid var(--color-divider); padding: var(--space-6); overflow: auto; display: flex; flex-direction: column; gap: var(--space-4); }\n  aside img { height: 44px; width: auto; align-self: flex-start; }\n  .kicker { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent-700); margin: 0; font-weight: 600; }\n  h1 { font-size: 20px; margin: 0; }\n  .group { display: grid; gap: var(--space-3); padding-top: var(--space-4); border-top: 2px solid var(--color-divider); }\n  .group h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--color-neutral-700); }\n  .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }\n  .field label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--color-neutral-800); }\n  .input { width: 100%; box-sizing: ar(--space-2) var(--space-3); border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); }\n  .spec div:nth-child(4n) { border-right: 0; }\n  .spec div[data-fh] { padding: 6px var(--space-3); } .spec div[data-fh] dd { font-size: 13px; } .spec div[data-fh] dt { margin-bottom: 2px; }\n  .spec dt { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-700); margin: 0 0 4px; }\n  .spec dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }\n  input[type=number] { -moz-appearance: textfield; } input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }\n  /* customer view (?panel=0): 3D only, no configurator */\n  body.clean { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }\n  body.clean aside, body.clean .toggle { display: none; }\n  body.clean .toggle.customer { display: flex; }\n  body.clean .viewport { grid-column: 1; grid-row: 1; }\n  body.clean .spec { grid-column: 1; grid-row: 2; }\n  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { grid-row: 1; grid-column: 1; border-right: 0; border-bottom: 2px solid var(--color-divider); max-height: 40vh; } .viewport, .spec { grid-column: 1; } .viewport { grid-row: 2; } .spec { grid-row: 3; grid-template-columns: repeat(2, 1fr); } .spec div:nth-child(4n) { border-right: 1px solid var(--color-divider); } .spec div:nth-child(2n) { border-right: 0; } }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<aside>\n  <img src=\"2aa77480-7a7e-4cfb-9368-79d0f56fd7f5\" alt=\"Schneider Lift (Thailand) Co., Ltd.\">\n  <div>\n    <p class=\"kicker\">Configurator<\u002Fp>\n    <h1>Traction elevator<\u002Fh1>\n  <\u002Fdiv>\n  <form id=\"f\" class=\"group\" autocomplete=\"off\">\n    <h2>Project<\u002Fh2>\n    <div class=\"field\"><label for=\"project\">Project name<\u002Flabel><input class=\"input\" id=\"project\" type=\"text\" placeholder=\"e.g. Sathorn Office Tower\"><\u002Fdiv>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"liftNo\">Lift no.<\u002Flabel><input class=\"input\" id=\"liftNo\" type=\"text\" placeholder=\"L-01\"><\u002Fdiv>\n      <div class=\"field\"><label for=\"location\">Location<\u002Flabel><input class=\"input\" id=\"location\" type=\"text\" placeholder=\"Bangkok\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"field\"><label for=\"modelName\">Model name <span style=\"color:var(--color-neutral-600)\">(optional)<\u002Fspan><\u002Flabel><input class=\"input\" id=\"modelName\" type=\"text\" placeholder=\"e.g. SL-MRL 450\"><\u002Fdiv>\n    <h2>Duty<\u002Fh2>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"capacity\">Capacity<\u002Flabel><div class=\"unit\" data-unit=\"kg\"><input class=\"input\" id=\"capacity\" name=\"capacity\" type=\"number\" min=\"240\" max=\"2500\" step=\"10\" value=\"450\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label for=\"persons\">Persons<\u002Flabel><input class=\"input\" id=\"persons\" type=\"text\" value=\"6\" readonly=\"\" tabindex=\"-1\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"field\"><label for=\"speed\">Speed<\u002Flabel>\n      <select class=\"input\" id=\"speed\" name=\"speed\"><option value=\"1\">1.0 m/s<\u002Foption><option value=\"1.5\">1.5 m/s<\u002Foption><option value=\"1.75\">1.75 m/s<\u002Foption><option value=\"2.5\">2.5 m/s<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"field\"><label for=\"roping\">Roping<\u002Flabel>\n      <select class=\"input\" id=\"roping\" form=\"f\"><option value=\"1\">1 : 1 direct<\u002Foption><option value=\"2\">2 : 1 diverter sheaves<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n  <\u002Fform>\n  <div class=\"group\" data-form=\"\">\n    <h2>Car<\u002Fh2>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"carW\">Width<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"carW\" name=\"carW\" type=\"number\" min=\"800\" max=\"3000\" step=\"50\" value=\"1800\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label for=\"carD\">Depth<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"carD\" name=\"carD\" type=\"number\" min=\"700\" max=\"3000\" step=\"50\" value=\"1500\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"field\"><label for=\"doorW\">Door opening<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"doorW\" name=\"doorW\" type=\"number\" min=\"600\" max=\"1600\" step=\"50\" value=\"1100\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"field\"><label for=\"doorType\">Door type<\u002Flabel>\n      <select class=\"input\" id=\"doorType\" form=\"f\"><option value=\"center\">Center-opening<\u002Foption><option value=\"side\">Side-slide<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"field\"><label for=\"doorPanels\">Door panels<\u002Flabel>\n      <select class=\"input\" id=\"doorPanels\" form=\"f\"><\u002Fselect>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"group\">\n    <h2>Shaft<\u002Fh2>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"shaftW\">Width<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"shaftW\" name=\"shaftW\" type=\"number\" min=\"1200\" max=\"4000\" step=\"50\" value=\"2500\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label for=\"shaftD\">Depth<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"shaftD\" name=\"shaftD\" type=\"number\" min=\"1200\" max=\"4000\" step=\"50\" value=\"2100\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"pit\">Pit<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"pit\" name=\"pit\" type=\"number\" min=\"1200\" max=\"3000\" step=\"50\" value=\"1400\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label for=\"overhead\">Overhead<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"overhead\" name=\"overhead\" type=\"number\" min=\"3600\" max=\"6000\" step=\"50\" value=\"4300\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"group\">\n    <h2>Floors<\u002Fh2>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"floors\">Stops<\u002Flabel><input class=\"input\" id=\"floors\" name=\"floors\" type=\"number\" min=\"2\" max=\"40\" step=\"1\" value=\"3\" form=\"f\"><\u002Fdiv>\n      <div class=\"field\"><label for=\"floorToFloor\">Default floor to floor<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"floorToFloor\" name=\"floorToFloor\" type=\"number\" min=\"2600\" max=\"6000\" step=\"50\" value=\"3400\" form=\"f\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"floorlist\" id=\"floorlist\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"notes\" id=\"notes\"><\u002Fdiv>\n  <div class=\"actions\">\n    <button class=\"btn btn-primary\" id=\"share\" type=\"button\">Copy link for customer<\u002Fbutton>\n    <button class=\"btn btn-secondary\" id=\"qr\" type=\"button\">QR customer link<\u002Fbutton>\n    <button class=\"btn btn-secondary\" id=\"play\" type=\"button\" aria-pressed=\"true\">Pause<\u002Fbutton>\n    <button class=\"btn btn-ghost\" id=\"reset\" type=\"button\">Reset<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Faside>\n<div class=\"qr-backdrop\" id=\"qrDialog\" hidden>\n  <section class=\"qr-dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"qrTitle\">\n    <button class=\"qr-close\" id=\"qrClose\" type=\"button\" aria-label=\"Close QR code\">&times;<\u002Fbutton>\n    <p class=\"kicker\">Customer link<\u002Fp>\n    <h2 id=\"qrTitle\">Scan to open this layout<\u002Fh2>\n    <div class=\"qr-code\" id=\"qrCode\" aria-label=\"QR code for the customer layout\"><\u002Fdiv>\n    <p class=\"qr-url\" id=\"qrUrl\"><\u002Fp>\n    <div class=\"qr-actions\">\n      <button class=\"btn btn-secondary\" id=\"qrCopy\" type=\"button\">Copy link<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"qrDownload\" type=\"button\">Download QR (SVG)<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<div class=\"viewport\">\n  <img class=\"brandmark\" src=\"2aa77480-7a7e-4cfb-9368-79d0f56fd7f5\" alt=\"Schneider Lift (Thailand) Co., Ltd.\">\n  <div class=\"jobcard\" id=\"jobcard\">\n    <p class=\"jobname\" data-j=\"project\"><\u002Fp>\n    <p class=\"jobmeta\"><span data-j=\"liftNo\"><\u002Fspan><span data-j=\"location\"><\u002Fspan><span data-j=\"modelName\"><\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <three-d-stage name=\"schneider-elevator\" background=\"#f3f2f2\"><\u002Fthree-d-stage>\n  <div class=\"labels\" id=\"labels\"><\u002Fdiv>\n  <div class=\"toggle customer\">\n    <button class=\"btn btn-secondary\" id=\"playView\" type=\"button\" aria-pressed=\"true\">Pause<\u002Fbutton>\n    <button class=\"btn btn-secondary\" id=\"dims\" type=\"button\" aria-pressed=\"true\">Dimensions on<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"toast\" id=\"toast\">Link copied<\u002Fdiv>\n<\u002Fdiv>\n<dl class=\"spec\" id=\"spec\">\n  <div><dt>Capacity<\u002Fdt><dd data-k=\"capacity\">450 kg / 6 p.<\u002Fdd><\u002Fdiv>\n  <div><dt>Speed<\u002Fdt><dd data-k=\"speedTxt\">1.0 m/s<\u002Fdd><\u002Fdiv>\n  <div><dt>Car W × D<\u002Fdt><dd data-k=\"car\">1800 × 1500<\u002Fdd><\u002Fdiv>\n  <div><dt>Door<\u002Fdt><dd data-k=\"door\">1,100 wide × 2,100 high<\u002Fdd><\u002Fdiv>\n  <div><dt>Shaft W × D<\u002Fdt><dd data-k=\"shaft\">2500 × 2100<\u002Fdd><\u002Fdiv>\n  <div><dt>Pit<\u002Fdt><dd data-k=\"pitTxt\">1400<\u002Fdd><\u002Fdiv>\n  <div><dt>Overhead<\u002Fdt><dd data-k=\"ohTxt\">4300<\u002Fdd><\u002Fdiv>\n  <div><dt>Travel / stops<\u002Fdt><dd data-k=\"travel\">6800 mm / 3<\u002Fdd><\u002Fdiv>\n  <div><dt>Door type<\u002Fdt><dd data-k=\"doorTypeTxt\">Center-opening, 2 panels<\u002Fdd><\u002Fdiv>\n  <div><dt>Door clear open<\u002Fdt><dd data-k=\"doorOpen\">1,100 mm<\u002Fdd><\u002Fdiv>\n  <div><dt>Roping<\u002Fdt><dd data-k=\"ropingTxt\">1 : 1<\u002Fdd><\u002Fdiv>\n  <div style=\"display:none\"><dt>Model<\u002Fdt><dd data-k=\"modelTxt\"><\u002Fdd><\u002Fdiv>\n  <div data-fh=\"\"><dt>Floor 1 → 2<\u002Fdt><dd>3,400<\u002Fdd><\u002Fdiv>\n  <div data-fh=\"\"><dt>Floor 2 → 3<\u002Fdt><dd>3,400<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<script src=\"3d7f3d19-d30f-4ed1-8e49-9da8611ef3c7\"><\u002Fscript>\n<script type=\"module\">\n  import * as THREE from 'three';\nimport { qrcode } from './assets/qrcode.mjs';\n\n// All sizes in mm (UI units); converted to meters inside.\nconst DEFAULTS = {\n  capacity: 450, persons: 6, speed: 1.0,\n  carW: 1800, carD: 1500, shaftW: 2500, shaftD: 2100,\n  doorW: 1100, doorH: 2100, doorType: 'center', doorPanels: 2,\n  roping: 1,\n  overhead: 4300, pit: 1400,\n  floorToFloor: 3400, floors: 3, floorHeights: null, logoUrl: null,\n};\n\n// Clamp user sizes to what physically fits; returns {params, notes[]}\nfunction normalize(opts = {}) {\n  const P = { ...DEFAULTS, ...opts }, notes = [];\n  P.floors = Math.min(40, Math.max(2, Math.round(P.floors || 2)));\n  if (P.carW > P.shaftW - 360) { P.carW = P.shaftW - 360; notes.push(`Car width limited to ${P.carW} mm (shaft − 360)`); }\n  if (P.carD > P.shaftD - 460) { P.carD = P.shaftD - 460; notes.push(`Car depth limited to ${P.carD} mm (shaft − 460)`); }\n  if (P.doorW > P.carW - 200) { P.doorW = P.carW - 200; notes.push(`Door width limited to ${P.doorW} mm (car − 200)`); }\n  P.doorType = P.doorType === 'side' ? 'side' : 'center';\n  const allowed = P.doorType === 'center' ? [2, 4] : [1, 2, 3];\n  if (!allowed.includes(+P.doorPanels)) { P.doorPanels = allowed[allowed.length > 2 ? 1 : 0]; notes.push(`Door panels set to ${P.doorPanels}`); }\n  P.doorPanels = +P.doorPanels;\n  P.roping = +P.roping === 2 ? 2 : 1;\n  if (P.pit < 1200) { P.pit = 1200; notes.push('Pit raised to 1200 mm minimum'); }\n  if (P.overhead < 3600) { P.overhead .2), vf = cam.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * cam.aspect);\n    const dist = r / Math.sin(Math.min(vf, hf)) * 1.05;\n    ctl.target.set(0.3, top / 2, 0);\n    cam.position.set(ctl.target.x + dist * 0.5, top / 2 + dist * 0.3, ctl.target.z + dist * 0.81);\n    ctl.update();\n  };\n  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(reframe, 120); }).observe(document.querySelector('.viewport'));\n  // one input per floor-to-floor gap; keeps values the user already typed\n  const syncFloorList = (n, def) => {\n    const cur = [...floorlist.querySelectorAll('input')].map(i => +i.value);\n    floorlist.innerHTML = '';\n    for (let i = 0; i < n - 1; i++) {\n      const v = cur[i] ?? def;\n      floorlist.insertAdjacentHTML('beforeend', `<div class=\"field\"><label for=\"fh${i}\">Floor ${i + 1} → ${i + 2}<\u002Flabel><div class=\"unit\" data-unit=\"mm\"><input class=\"input\" id=\"fh${i}\" type=\"number\" min=\"2600\" max=\"8000\" step=\"50\" value=\"${v}\" form=\"f\"><\u002Fdiv><\u002Fdiv>`);\n    }\n  };\n  const rebuild = () => {\n    const raw = read();\n    const n = Math.min(40, Math.max(2, Math.round(raw.floors || 2)));\n    if (floorlist.querySelectorAll('input').length !== n - 1) { syncFloorList(n, raw.floorToFloor); raw.floorHeights = read().floorHeights; }\n    const { params: P, notes } = normalize({ ...raw, logoUrl: './assets/schneider-logo.jpg' });\n    notesEl.innerHTML = notes.map(n => `<span>${n}<\u002Fspan>`).join('');\n    const old = model;\n    // build the full stack: one modelled floor per stop\n    model = buildElevator(P);\n    stage.setObject(model);\n    old?.traverse(o => { o.geometry?.dispose?.(); });\n    dims?.parent?.remove(dims);\n    dims = buildDimensions(model, labelsEl, { travel: P.floorHeights.reduce((a, b) => a + b, 0), stops: P.floors });\n    dims.visible = showDims; labelsEl.style.display = showDims ? '' : 'none';\n    stage._scene.add(dims);\n    // frame the whole tower plus dimension lines f ncodeConfig({ ...raw, floorHeights: P.floorHeights });\n    history.replaceState(null, '', '?c=' + code + (clean ? '&panel=0' : ''));\n    shareUrl = location.origin + location.pathname + '?c=' + code + '&panel=0';\n  };\n  // inputs sit outside <form> (they use form=\"f\"), so listen on the sidebar itself\n  document.querySelector('aside').addEventListener('input', (e) => {\n    clearTimeout(timer);\n    if (e.target.id === 'floorToFloor') floorlist.querySelectorAll('input').forEach(i => i.value = e.target.value);\n    // add/remove floor boxes the moment the stop count changes\n    if (e.target.id === 'floors') { const n = Math.min(40, Math.max(2, Math.round(+e.target.value || 2))); syncFloorList(n, +document.getElementById('floorToFloor').value); }\n    if (e.target.id === 'doorType') syncPanels();\n    timer = setTimeout(rebuild, 250);\n  });\n  document.querySelector('aside').addEventListener('change', (e) => { if (e.target.tagName === 'SELECT') { if (e.target.id === 'doorType') syncPanels(); clearTimeout(timer); timer = setTimeout(rebuild, 60); } });\n  document.getElementById('reset').onclick = () => { ids.forEach(id => document.getElementById(id).value = DEFAULTS[id]); textIds.forEach(id => document.getElementById(id).value = ''); syncPanels(DEFAULTS.doorPanels); floorlist.innerHTML = ''; rebuild(); };\n  const dimBtn = document.getElementById('dims');\n  const toast = document.getElementById('toast');\n  const qrDialog = document.getElementById('qrDialog'), qrMount = document.getElementById('qrCode'), qrUrl = document.getElementById('qrUrl');\n  const qrClose = document.getElementById('qrClose'), qrCopy = document.getElementById('qrCopy'), qrDownload = document.getElementById('qrDownload');\n  let qrSvg = '', toastTimer;\n  const showToast = (message) => {\n    toast.textContent = message;\n    toast.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);\n  };\n  const copyCustomerLink tn.setAttribute('aria-pressed', String(showDims)); if (dims) dims.visible = showDims; labelsEl.style.display = showDims ? '' : 'none'; };\n  const btn = document.getElementById('play'), btnView = document.getElementById('playView');\n  const setRun = (v) => { running = v; [btn, btnView].forEach(b => { b.textContent = v ? 'Pause' : 'Play'; b.setAttribute('aria-pressed', String(v)); }); };\n  btn.onclick = btnView.onclick = () => setRun(!running);\n  rebuild();\n  let last = performance.now();\n  const frame = (now) => {\n    const dt = Math.min(0.05, (now - last) / 1000); last = now;\n    if (running && model) { const p = cycle.step(dt); poseElevator(model, p.y, p.door, p.doorFloor, p.brake); }\n    if (showDims) updateLabels(dims, stage._camera, stage._renderer);\n    requestAnimationFrame(frame);\n  };\n  requestAnimationFrame(frame);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
